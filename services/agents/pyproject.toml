[project]
name = "unprompted-agents"
version = "0.1.0"
description = "Agent Attack runners for Unprompted (workstream A): real browser agents take our own sandbox quizzes."
requires-python = ">=3.12"
dependencies = [
    "browser-use==1.0.4",
    "python-dotenv>=1.2.4",
    "httpx>=0.27",
]

[project.scripts]
attack = "unprompted_agents.cli:main"
attack-merge = "unprompted_agents.cli:merge_main"
coursescan = "unprompted_agents.coursescan:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
