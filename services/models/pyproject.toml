[project]
name = "unprompted-models"
version = "0.1.0"
description = "Agent-likelihood model over Tiger session features (evidence for professors, never a verdict)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "psycopg[binary]>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
